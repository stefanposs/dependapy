[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-py-project"
version = "0.1.0"
description = "Example project with intentionally outdated dependencies for testing dependapy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Example Author", email = "example@example.com" }]

dependencies = [
    "requests>=2.28.0",
    "packaging>=23.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/example_py_project"]

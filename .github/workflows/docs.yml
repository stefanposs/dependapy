# GitHub Actions workflow for building mkdocs documentation.
# Cleans and rebuilds docs/ on every merge to main.
# GitHub Pages is configured to serve from main/docs.

name: Build Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Clean old docs
        run: rm -rf docs/

      - name: Build documentation
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --config-file mkdocs.yml --strict

      - name: Commit & push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force docs/
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: rebuild documentation site [skip ci]"
            git push
          fi
